<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special Message 😌</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@500;700&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #3b164f, transparent 35%),
                radial-gradient(circle at bottom right, #24144d, transparent 35%),
                linear-gradient(135deg, #090018, #1b1035, #090018);
            background-size: 200% 200%;
            animation: bgMove 14s ease infinite;
            color: white;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        @keyframes bgMove {
            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        /* Floating emojis */

        .emoji {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
            animation: floatEmoji linear infinite;
        }

        @keyframes floatEmoji {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main container */

        .container {
            width: 92%;
            max-width: 700px;
            margin: 30px auto;
            padding: 28px 22px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            backdrop-filter: blur(14px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 5;
            animation: containerIn 1s ease;
        }

        @keyframes containerIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Heading */

        .big-emoji {
            font-size: 3.2rem;
            display: inline-block;
            animation: bounce 1.5s infinite;
            filter: drop-shadow(0 0 8px rgba(255, 120, 160, 0.6));
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .welcome {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.35;
            margin: 8px 0;
            color: #ff9fbe;
            text-shadow:
                0 0 6px rgba(255, 90, 140, 0.6),
                0 0 14px rgba(255, 60, 120, 0.25);
        }

        .subtitle {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.05rem;
            color: #e9cbd7;
            margin: 10px 0 25px;
        }

        /* Message */

        .message-box {
            background: rgba(5, 5, 12, 0.72);
            padding: 28px 22px;
            border-radius: 22px;
            border: 1px solid rgba(255, 100, 150, 0.28);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            animation: messageIn 1.2s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .message-title {
            font-family: 'Pacifico', cursive;
            font-size: 1.9rem;
            color: #ff9fbd;
            margin-bottom: 22px;
            text-shadow: 0 0 8px rgba(255, 70, 120, 0.5);
        }

        .message {
            direction: rtl;
            text-align: right;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.12rem;
            line-height: 2.2;
            color: #f8e8ee;
        }

        .footer {
            margin-top: 25px;
            color: #aaa;
            font-size: 0.85rem;
        }

        .footer span {
            color: #ff719b;
        }

        @media (max-width: 500px) {

            .container {
                width: 94%;
                padding: 22px 15px;
                margin: 20px auto;
            }

            .welcome {
                font-size: 2.2rem;
            }

            .message-box {
                padding: 22px 17px;
            }

            .message {
                font-size: 1rem;
                line-height: 2.05;
            }

            .message-title {
                font-size: 1.65rem;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Emojis -->

    <div class="emoji" style="left:5%; animation-duration:10s;">🤣</div>
    <div class="emoji" style="left:18%; animation-duration:13s; animation-delay:2s;">😂</div>
    <div class="emoji" style="left:32%; animation-duration:11s; animation-delay:1s;">😌</div>
    <div class="emoji" style="left:48%; animation-duration:14s; animation-delay:4s;">✨</div>
    <div class="emoji" style="left:65%; animation-duration:12s; animation-delay:2s;">🤣</div>
    <div class="emoji" style="left:80%; animation-duration:15s; animation-delay:5s;">😂</div>
    <div class="emoji" style="left:93%; animation-duration:10s; animation-delay:3s;">😌</div>


    <div class="container">

        <div class="big-emoji">🤣</div>

        <h1 class="welcome">
            Welcome Rida 😌✨
        </h1>

        <div class="subtitle">
            🌸 Special Message 🌸
        </div>


        <div class="message-box">

            <div class="message-title">
                💌 SPICAL MESAGE 💌
            </div>

            <div class="message">

                oye batamez birthday gaye ap k to yaha fir k leny aaye ho🤣🤣

                aj kal web dekh rai ho pely web py spical mesage ap k leye 😌pely pely

            </div>

        </div>


        <div class="footer">
            Made with <span>❤️</span> by Shahban Ali
        </div>

    </div>


    <script>

        const emojis = [
            "🤣",
            "😂",
            "😌",
            "✨",
            "💖",
            "🌸"
        ];

        function createEmoji() {

            const emoji = document.createElement("div");

            emoji.className = "emoji";

            emoji.innerText =
                emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left =
                Math.random() * 100 + "%";

            emoji.style.fontSize =
                (18 + Math.random() * 14) + "px";

            emoji.style.animationDuration =
                (9 + Math.random() * 7) + "s";

            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 16000);
        }

        setInterval(createEmoji, 1400);

    </script>

</body>

</html>
